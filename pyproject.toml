[project]
name = "airline-cascades"
version = "1.0.0"
description = "Airline operations database that propagates a single delay across aircraft, crew, gates and runway slots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
